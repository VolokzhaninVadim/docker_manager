services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config_portainer:/data
    ports:
      - "9000:9000"
    networks:
      - default

networks:
  default:
    external: true
    name: volokzhanin